<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fleet Detector — Upload</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f0f0f0; padding:30px; color:#222; }
    .box { max-width:700px; margin:40px auto; background:#fff; padding:20px; border-radius:8px; box-shadow:0 2px 8px rgba(0,0,0,0.06); text-align:center; }
    input[type=file] { margin-top:10px; }
    button { margin-top:14px; padding:10px 14px; background:#1976d2; color:#fff; border:none; border-radius:6px; cursor:pointer; }
    .hint { font-size:0.9em; color:#666; margin-top:8px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Infinite Lagrange — Fleet Detector</h1>
    <p>Upload a screenshot or a video file. Supported images: PNG/JPG. Supported videos: MP4/MOV/AVI.</p>
    <form method="POST" enctype="multipart/form-data">
      <input type="file" name="file" accept="image/*,video/*" required><br>
      <button type="submit">Upload & Process</button>
    </form>
    <div class="hint">Tip: videos are processed frame-by-frame on the server (can be slow on CPU-only VPS).</div>
  </div>
</body>
</html>
